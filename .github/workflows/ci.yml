name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic-data contract
        run: python -m unittest discover -s tests -p "test_*.py" -v

  r-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::lme4
            any::nlme
          needs: check
      - name: Run model tests
        run: Rscript tests/test_models.R
      - name: Run synthetic example
        run: Rscript scripts/run_analysis.R --output output
